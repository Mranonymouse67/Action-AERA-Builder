name: Build AERA browser plugin (Adreno 613 Turnip + Zink)

# Browser-only build. No recovery image is built or needed.
#   browser_build   -> Turnip with Adreno 613 support + VK 1.1 exposure patch,
#                      and Mesa EGL/Zink (KGSL surfaceless patch), Zink only
#   browser_package -> overlay onto the published runtime, pack, unsigned .aerap
# Output: artifact "aera-browser-plugin" containing only the .aerap. Install it on the device.
# (The turnip / mesa-egl artifacts only pass files between the two jobs and expire after 1 day.)

on:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: "Plugin version (blank = 1.6.<run number>). Must differ from the repo's plugin.json."
        required: false
        type: string

      staged_runtime_url:
        description: "Optional URL of a staged ARM64 runtime tarball (blank = published runtime)"
        required: false
        type: string

jobs:
  # ===========================================================================
  #   1) browser_build  : Turnip (Adreno 613) + Mesa EGL/Zink
  #   2) browser_package: overlay onto the published runtime, pack, build the .aerap
  # ===========================================================================
  browser_build:
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    outputs:
      turnip: ${{ steps.turnip_upload.outcome }}
    env:
      MESA_VERSION: "26.2.2"
      # Redmi "sky" (ravelin): qcom,chipid = <0x06010300>, Adreno613v1 (gen6_3_26_0).
      A613_CHIP_ID: "0x06010300"
    steps:
      - name: Fetch AERA browser plugin sources (AERA-Plugins/browser)
        run: |
          git clone --depth 1 https://github.com/AERA-Plugins/browser.git browser-src

      - name: Download Mesa and add Adreno 613 (Turnip tree)
        run: |
          cd browser-src
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 900 "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz" | tar -xJ
          mv "mesa-${MESA_VERSION}" mesa-src
          cd mesa-src
          dev=src/freedreno/common/freedreno_devices.py
          python3 - "$dev" <<'PY'
          import os, re, sys
          p = sys.argv[1]
          s = open(p).read()
          if "Adreno (TM) 613" in s:
              print("Adreno (TM) 613 already present; not inserting")
              sys.exit(0)
          m = re.search(r'^([ \t]*)GPUId\(612\),\n', s, re.M)
          if not m:
              print("::error::GPUId(612) anchor not found")
              sys.exit(1)
          ind = m.group(1)
          cid = os.environ["A613_CHIP_ID"]
          name = '"Adreno (TM) 613"'
          ids = [
              f'GPUId(613, name={name})',
              f'GPUId(chip_id={cid}, name={name})',
              f'GPUId(chip_id=0xffff{cid[2:]}, name={name})',
          ]
          add = "".join(f"{ind}{i},\n" for i in ids)
          s = s[:m.end()] + add + s[m.end():]
          open(p, "w").write(s)
          print("inserted Adreno 613 entries")
          PY

      # Turnip hides VK 1.1+ extensions (incl. VK_KHR_maintenance5, which Zink requires)
      # on GPUs without hw multiview. Mark the A613 as multiview-capable so Zink starts.
      - name: Force VK 1.1 / maintenance5 on the A613 (Turnip source patch)
        run: |
          cd browser-src/mesa-src
          python3 - <<'PY'
          import re, sys
          p = "src/freedreno/vulkan/tu_device.cc"
          s = open(p).read()
          pat = re.compile(r'return\s+device->info->props\.has_hw_multiview\s*\|\|\s*TU_DEBUG\(NOCONFORM\);')
          if len(pat.findall(s)) != 1:
              print("::error::tu_has_multiview anchor not found exactly once in " + p)
              sys.exit(1)
          s = pat.sub("return true; /* AERA: A613 forced multiview so Turnip exposes VK 1.1+ and VK_KHR_maintenance5 */", s)
          open(p, "w").write(s)
          print("patched tu_has_multiview -> true")
          PY

      - name: Build libvulkan_freedreno.so (Alpine / musl)
        run: |
          set -o pipefail
          cd browser-src
          cat > build-in-alpine.sh <<'SCRIPT'
          set -eu
          apk add --no-cache \
            bash coreutils patch grep sed curl xz git \
            build-base linux-headers meson samurai pkgconf \
            python3 py3-mako py3-yaml py3-packaging py3-setuptools \
            flex bison glslang vulkan-headers \
            zlib-dev zstd-dev expat-dev libdrm-dev libxml2-dev

          cat > /tmp/cross.ini <<'EOF2'
          [binaries]
          c = 'gcc'
          cpp = 'g++'
          ar = 'ar'
          strip = 'strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = false
          EOF2

          export NINJA=samu
          export AERA_BROWSER_JOBS="$(nproc)"
          mkdir -p /work/out
          bash source/build-turnip-a825.sh /work/mesa-src /work/mesa-build /tmp/cross.ini
          cp /work/mesa-build/src/freedreno/vulkan/libvulkan_freedreno.so /work/out/
          strip --strip-unneeded /work/out/libvulkan_freedreno.so
          SCRIPT
          docker run --rm -v "$PWD":/work -w /work alpine:3.22 sh build-in-alpine.sh

      - name: Verify the built Turnip driver
        run: |
          cd browser-src
          sudo apt-get install -y binutils >/dev/null
          lib=out/libvulkan_freedreno.so
          strings "$lib" | grep -qF 'Adreno (TM) 613' \
            || { echo "::error::Adreno (TM) 613 not present in built driver"; exit 1; }
          for n in 'Adreno (TM) 722' 'Adreno (TM) 825'; do
            strings "$lib" | grep -qF "$n" || { echo "::error::$n missing from built driver"; exit 1; }
          done

      - name: Upload Turnip driver
        id: turnip_upload
        uses: actions/upload-artifact@v4
        with:
          name: turnip
          path: browser-src/out/libvulkan_freedreno.so
          if-no-files-found: error
          retention-days: 1

      # The runtime's EGL/Zink is a separate Mesa build. This rebuilds it from the repo
      # recipe (EGL, GLES2, Zink, surfaceless, no LLVM) with the KGSL surfaceless patch,
      # (Zink only, no software renderer). Non-fatal: if it fails
      # the package job keeps the runtime's stock EGL/Zink.
      - name: Build Mesa EGL + Zink
        id: mesa_egl
        continue-on-error: true
        timeout-minutes: 150
        run: |
          set -o pipefail
          cd browser-src
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 900 "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz" | tar -xJ
          mv "mesa-${MESA_VERSION}" mesa-egl-pristine
          patch -d mesa-egl-pristine -p1 -i "$PWD/source/patches/mesa-${MESA_VERSION}-zink-kgsl-surfaceless"*.patch
          cat > build-egl-in-alpine.sh <<'SCRIPT'
          set -eu
          apk add --no-cache \
            bash coreutils patch grep sed curl xz git \
            build-base linux-headers meson samurai pkgconf \
            python3 py3-mako py3-yaml py3-packaging py3-setuptools \
            flex bison glslang vulkan-headers \
            zlib-dev zstd-dev expat-dev libdrm-dev libxml2-dev

          cat > /tmp/cross.ini <<'EOF2'
          [binaries]
          c = 'gcc'
          cpp = 'g++'
          ar = 'ar'
          strip = 'strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = false
          EOF2

          GALLIUM=zink
          try_build() {
            plat=$1
            tag="platforms_${plat:-none}-gallium_${GALLIUM}"
            echo "=============== attempt: $tag ==============="
            rm -rf /work/mesa-egl /work/mesa-egl-build /work/egl-install
            cp -a /work/mesa-egl-pristine /work/mesa-egl || return 1
            meson setup /work/mesa-egl-build /work/mesa-egl \
              --cross-file /tmp/cross.ini \
              -Dprefix=/usr -Dlibdir=lib -Dbuildtype=release \
              -Dgallium-drivers=$GALLIUM -Dvulkan-drivers= -Dplatforms=$plat \
              -Degl=enabled -Dgles1=disabled -Dgles2=enabled -Dopengl=false \
              -Dglx=disabled -Dgbm=disabled -Dllvm=disabled -Dvideo-codecs= \
              -Dbuild-tests=false -Dglvnd=disabled || return 1
            samu -C /work/mesa-egl-build || return 1
            DESTDIR=/work/egl-install meson install -C /work/mesa-egl-build --no-rebuild || return 1
            find /work/egl-install -name '*.so*' -exec strip --strip-unneeded {} + 2>/dev/null
            echo "$tag" > /work/egl-install/BUILD_TAG
            return 0
          }

          for plat in surfaceless ""; do
            if try_build "$plat"; then
              echo "SUCCESS: $(cat /work/egl-install/BUILD_TAG)"
              exit 0
            fi
          done
          echo "all Mesa EGL/Zink build variants failed"
          exit 1
          SCRIPT
          docker run --rm -v "$PWD":/work -w /work alpine:3.22 sh build-egl-in-alpine.sh

      - name: Collect Mesa EGL/Zink output
        if: ${{ steps.mesa_egl.outcome == 'success' }}
        continue-on-error: true
        run: |
          cd browser-src
          sudo chown -R "$(id -u):$(id -g)" egl-install
          lib=egl-install/usr/lib
          mkdir -p egl-out
          cp -L "$lib"/libEGL.so.1 egl-out/libEGL.so.1
          cp -L "$lib"/libGLESv2.so.2 egl-out/libGLESv2.so.2
          cp -L "$lib"/libgallium-*.so egl-out/libgallium.so
          : > egl-out/dri-names.txt
          for n in zink; do
            [ -e "$lib/dri/${n}_dri.so" ] && echo "$n" >> egl-out/dri-names.txt
          done
          cp egl-install/BUILD_TAG egl-out/BUILD_TAG

      - name: Upload Mesa EGL/Zink output
        if: ${{ steps.mesa_egl.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mesa-egl
          path: browser-src/egl-out
          if-no-files-found: error
          retention-days: 1

  browser_package:
    needs: browser_build
    if: ${{ !cancelled() && needs.browser_build.outputs.turnip == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      STAGED_RUNTIME_URL: ${{ inputs.staged_runtime_url || vars.STAGED_RUNTIME_URL }}
      STAGED_RUNTIME_TOKEN: ${{ secrets.STAGED_RUNTIME_TOKEN }}
    steps:
      - name: Fetch AERA browser plugin sources (AERA-Plugins/browser)
        run: |
          git clone --depth 1 https://github.com/AERA-Plugins/browser.git browser-src

      - name: Resolve plugin version (must differ from plugin.json)
        run: |
          cd browser-src
          ver="${{ inputs.plugin_version }}"
          cur=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")
          if [ -z "$ver" ]; then
            ver="1.6.${GITHUB_RUN_NUMBER}"
            echo "No plugin_version input; using $ver (repo plugin.json is $cur)"
          fi
          if [ "$ver" = "$cur" ]; then
            echo "::error::Version $ver equals plugin.json ($cur). Pick another."
            exit 1
          fi
          echo "PLUGIN_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Building plugin version $ver (was $cur)"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils zstd xxd binutils

      - uses: actions/download-artifact@v4
        with:
          name: turnip
          path: browser-src/turnip

      - name: Download Mesa EGL/Zink build (if it was produced)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mesa-egl
          path: browser-src/mesa-egl

      - name: Fetch base runtime
        run: |
          cd browser-src
          mkdir stage
          if [ -n "${STAGED_RUNTIME_URL:-}" ]; then
            auth=()
            [ -n "${STAGED_RUNTIME_TOKEN:-}" ] && auth=(-H "Authorization: Bearer $STAGED_RUNTIME_TOKEN")
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 1200 "${auth[@]}" -o stage.tar "$STAGED_RUNTIME_URL"
            # Symlinks (musl loader alias) must survive extraction; pack.py resolves them.
            tar --no-same-owner -xf stage.tar -C stage
            if [ "$(ls -A stage | wc -l)" = 1 ] && [ -d "stage/$(ls stage)" ]; then
              mv "stage/$(ls stage)" stage-root && rm -rf stage && mv stage-root stage
            fi
          else
            # No staged tarball given: start from the currently published runtime
            # named in plugin.json, so only the replaced libraries change.
            url=$(python3 -c "import json;print(json.load(open('plugin.json'))['payload_url'])")
            want=$(python3 -c "import json;print(json.load(open('plugin.json'))['payload_sha256'])")
            echo "STAGED_RUNTIME_URL not set; using published runtime: $url"
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 1200 -o base-runtime.xz "$url"
            echo "$want  base-runtime.xz" | sha256sum -c -
            python3 - base-runtime.xz stage <<'PY'
          import os, struct, subprocess, sys

          src, dest = sys.argv[1], sys.argv[2]
          raw = subprocess.run(["xz", "-dc", src], check=True, stdout=subprocess.PIPE).stdout
          if raw[:8] != b"AERAWEB1":
              sys.exit("not an AERA runtime payload")
          count = struct.unpack_from("<I", raw, 8)[0]
          pos = 12
          root = os.path.realpath(dest)
          for _ in range(count):
              nlen, mode, size = struct.unpack_from("<HHQ", raw, pos)
              pos += 12
              name = raw[pos:pos + nlen].decode("utf-8")
              pos += nlen
              pos += -pos % 4
              data = raw[pos:pos + size]
              pos += size
              if name.startswith("/") or any(p in ("", ".", "..") for p in name.split("/")):
                  sys.exit(f"unsafe path in payload: {name}")
              path = os.path.join(root, name)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              if mode == 0:  # symlink; payload stores the target relative to the runtime root
                  target = os.path.relpath(os.path.join(root, data.decode()), os.path.dirname(path))
                  os.symlink(target, path)
              else:
                  with open(path, "wb") as f:
                      f.write(data)
                  os.chmod(path, mode)
          if pos != len(raw):
              sys.exit("trailing bytes in payload")
          print(f"unpacked {count} members")
          PY
          fi
          find stage -type f | wc -l

      - name: Replace Turnip driver in staged runtime
        run: |
          cd browser-src
          mapfile -t hits < <(find stage -name libvulkan_freedreno.so -type f)
          if [ "${#hits[@]}" -eq 0 ]; then
            echo "::error::libvulkan_freedreno.so not found in staged runtime"; exit 1
          fi
          for h in "${hits[@]}"; do
            echo "replacing $h"
            install -m 0755 turnip/libvulkan_freedreno.so "$h"
            strings "$h" | grep -qF 'Adreno (TM) 613' \
              || { echo "::error::$h lacks Adreno 613 after replace"; exit 1; }
          done

      # Non-fatal. Swaps the runtime's EGL/GLES/Zink libraries for the rebuilt ones
      # only when every dependency is already present in the runtime.
      - name: Swap in rebuilt Mesa EGL/Zink if available
        continue-on-error: true
        run: |
          cd browser-src
          if [ ! -f mesa-egl/libgallium.so ]; then
            echo "No rebuilt Mesa EGL/Zink artifact; keeping the runtime's own EGL/Zink."
            exit 0
          fi
          zd=$(find stage -name zink_dri.so -type f | head -1)
          [ -n "$zd" ] || { echo "::warning::zink_dri.so not found in runtime; skipping Mesa swap"; exit 0; }
          libdir=$(dirname "$(dirname "$zd")")
          for f in libEGL.so.1 libGLESv2.so.2; do
            [ -f "$libdir/$f" ] || { echo "::warning::$libdir/$f missing; skipping Mesa swap"; exit 0; }
          done
          soname=$(readelf -d mesa-egl/libgallium.so | sed -n 's/.*Library soname: \[\(.*\)\]/\1/p')
          echo "new libgallium SONAME: $soname"
          [ "$soname" = "libgallium-26.2.2.so" ] || { echo "::warning::unexpected SONAME; skipping Mesa swap"; exit 0; }
          missing=0
          for f in mesa-egl/libEGL.so.1 mesa-egl/libGLESv2.so.2 mesa-egl/libgallium.so; do
            for n in $(readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
              if [ ! -e "$libdir/$n" ] && [ "$n" != "libgallium-26.2.2.so" ]; then
                echo "::warning::$f needs $n, which the runtime does not have"
                missing=1
              fi
            done
          done
          [ "$missing" = 0 ] || { echo "::warning::dependency closure not satisfied; skipping Mesa swap"; exit 0; }
          size=$(stat -c%s mesa-egl/libgallium.so)
          [ "$size" -lt 100000000 ] || { echo "::warning::libgallium too large for the payload limit; skipping"; exit 0; }
          install -m 0755 mesa-egl/libgallium.so "$zd"
          install -m 0755 mesa-egl/libEGL.so.1 "$libdir/libEGL.so.1"
          install -m 0755 mesa-egl/libGLESv2.so.2 "$libdir/libGLESv2.so.2"
          echo "MESA_SWAPPED=1" >> "$GITHUB_ENV"

      - name: Pack runtime.xz
        run: cd browser-src && python3 source/pack.py stage build

      - name: Update plugin.json
        run: |
          cd browser-src
          python3 - "$PLUGIN_VERSION" <<'PY'
          import hashlib, json, os, re, sys
          ver = sys.argv[1]
          hpp = open("build/aera_browser_payload.hpp").read()
          num = lambda k: int(re.search(rf"{k}\s*=\s*(\d+)", hpp).group(1))
          txt = lambda k: re.search(rf'{k}\[\]\s*=\s*"([0-9a-f]+)"', hpp).group(1)
          p = json.load(open("plugin.json"))
          p["version"] = ver
          p["payload_url"] = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                              f"/releases/download/v{ver}/runtime.xz")
          p["payload_size"]    = num("kCompressedBytes")
          p["payload_sha256"]  = txt("kCompressedHash")
          p["expanded_size"]   = num("kExpandedBytes")
          p["expanded_sha256"] = txt("kExpandedHash")
          p["member_count"]    = num("kMemberCount")
          assert hashlib.sha256(open("build/runtime.xz","rb").read()).hexdigest() == p["payload_sha256"]
          json.dump(p, open("build/plugin.json","w"), indent=2, ensure_ascii=False)
          open("build/plugin.json","a").write("\n")
          PY

      # Unsigned: installable from the recovery Files app after a security warning.
      - name: Build unofficial .aerap package
        run: |
          cd browser-src
          git clone --depth 1 https://github.com/AERA-Plugins/registry.git /tmp/registry
          python3 /tmp/registry/scripts/package_aerap.py \
            --manifest build/plugin.json \
            --payload build/runtime.xz \
            --output "build/AERA-Browser-${PLUGIN_VERSION}.aerap"
          {
            echo "### Browser plugin ${PLUGIN_VERSION}"
            echo "- Turnip: Adreno 613 + multiview patch"
            echo "- Mesa EGL/Zink swapped: ${MESA_SWAPPED:-0}"
            [ -f mesa-egl/BUILD_TAG ] && echo "- Mesa build variant: $(cat mesa-egl/BUILD_TAG)"
            echo "- Package: AERA-Browser-${PLUGIN_VERSION}.aerap (unsigned)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: aera-browser-plugin
          path: browser-src/build/AERA-Browser-*.aerap
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
           browser-src/build/AERA-Browser-*.aerap        
  summary:
    if: ${{ always() }}
    needs: [browser_build, browser_package]
    runs-on: ubuntu-24.04
    steps:
      - name: Job results
        run: |
          {
            echo "## AERA browser-only build"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| browser_build | ${{ needs.browser_build.result }} |"
            echo "| browser_package | ${{ needs.browser_package.result }} |"
            echo
            echo "Artifact: aera-browser-plugin."
          } >> "$GITHUB_STEP_SUMMARY"
